name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          $env:PYTHONPATH = 'python/prototype'
          # pytest, not unittest discover: test_dialog_guard.py and
          # test_main_window_flows.py are pytest-fixture-based (dialog_responses,
          # main_window, etc. from conftest.py) and are silently skipped rather
          # than actually run under plain unittest discovery.
          $junitPath = 'pytest-results.xml'
          python -m pytest python/tests -v "--junitxml=$junitPath"
          $exitCode = $LASTEXITCODE

          # PySide6/Qt can crash during interpreter teardown on Windows after
          # every test has already passed, and the exit code that crash
          # surfaces as is NOT consistent across environments -- observed
          # -1073741819 (0xC0000005, STATUS_ACCESS_VIOLATION) locally but a
          # plain 1 (pytest's own "tests failed" code) on GitHub Actions'
          # windows-latest runner, so exit-code allowlisting can't tell a
          # real failure from teardown noise. The JUnit XML is written before
          # teardown runs, so trust its failure/error counts instead.
          [xml]$results = Get-Content $junitPath
          $suite = if ($results.DocumentElement.Name -eq 'testsuite') { $results.DocumentElement } else { $results.testsuites.testsuite }
          $failures = [int]$suite.failures
          $errors = [int]$suite.errors

          if ($failures -eq 0 -and $errors -eq 0) {
            if ($exitCode -ne 0) {
              Write-Output "All $($suite.tests) tests passed per JUnit XML (0 failures/errors); ignoring exit code $exitCode from a post-test Qt teardown crash."
            }
            exit 0
          }
          throw "Tests failed: $failures failures, $errors errors (exit code $exitCode) -- see $junitPath"
