name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run prototype tests
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python -m pytest proto/tests -v --junitxml=pytest-results.xml
          $exitCode = $LASTEXITCODE
          [xml]$results = Get-Content pytest-results.xml
          $suite = if ($results.DocumentElement.Name -eq 'testsuite') { $results.DocumentElement } else { $results.testsuites.testsuite }
          $failures = [int]$suite.failures
          $errors = [int]$suite.errors
          if ($failures -gt 0 -or $errors -gt 0) { throw "Prototype tests failed: $failures failures, $errors errors" }
          if ($exitCode -ne 0) { Write-Output "All $($suite.tests) tests passed; pytest returned $exitCode during Qt teardown." }
      - name: Install MinGW
        shell: pwsh
        run: choco install mingw python --yes --no-progress
      - name: Fetch native dependencies
        shell: pwsh
        run: |
          ./scripts/fetch_webview2_sdk.ps1
          ./scripts/fetch_pdfium.ps1
      - name: Build and run native tests
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python scripts/build.py all
          if ($LASTEXITCODE -ne 0) { throw 'Build or native tests failed' }
