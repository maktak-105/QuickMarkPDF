name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run prototype tests
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python proto/tests/run_tests.py -- proto/tests
          if ($LASTEXITCODE -ne 0) { throw 'Prototype tests failed' }
      - name: Install MinGW
        shell: pwsh
        run: choco install mingw python --yes --no-progress
      - name: Fetch native dependencies
        shell: pwsh
        run: |
          ./scripts/fetch_webview2_sdk.ps1
          ./scripts/fetch_pdfium.ps1
      - name: Build and run native tests
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python scripts/build.py all
          if ($LASTEXITCODE -ne 0) { throw 'Build or native tests failed' }
