name: Build and upload distribution asset

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to update, for example v1.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW and Python
        shell: pwsh
        run: choco install mingw python --yes --no-progress

      - name: Fetch WebView2 SDK and PDFium
        shell: pwsh
        run: |
          powershell -File scripts\fetch_webview2_sdk.ps1
          powershell -File scripts\fetch_pdfium.ps1

      - name: Build native application
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python scripts/build.py
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }

      - name: Package distribution files
        shell: pwsh
        run: |
          $files = @(
            'dist/QuickMarkPDF.exe',
            'dist/QuickMarkPDF_cli.exe',
            'dist/pdfium.dll',
            'dist/WebView2Loader.dll',
            'docs/distribution/readme.txt',
            'docs/distribution/readme_jp.txt',
            'docs/distribution/history.txt',
            'docs/distribution/history_jp.txt',
            'docs/distribution/LICENSE.txt',
            'docs/distribution/LICENSE_jp.txt'
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
          }
          $staging = Join-Path $env:RUNNER_TEMP 'QuickMarkPDF-package'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file -Destination $staging -Force
          }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'QuickMarkPDF-binary.zip') -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $checksumFile = Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS.txt'
          $lines = @()
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'QuickMarkPDF-binary.zip'
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToUpper()
          $lines += "$zipHash  QuickMarkPDF-binary.zip"
          $lines += ""
          $lines += "# Binaries inside archive:"
          $binFiles = @('dist/QuickMarkPDF.exe', 'dist/QuickMarkPDF_cli.exe', 'dist/pdfium.dll', 'dist/WebView2Loader.dll')
          foreach ($f in $binFiles) {
            if (Test-Path -LiteralPath $f) {
              $h = (Get-FileHash -Algorithm SHA256 -Path $f).Hash.ToUpper()
              $name = Split-Path -Leaf $f
              $lines += "$h  $name"
            }
          }
          $lines | Set-Content -Path $checksumFile -Encoding utf8

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            QuickMarkPDF-binary.zip
            SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
          body: |
            QuickMarkPDF ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Download `QuickMarkPDF-binary.zip`, extract every file into the same folder, and run `QuickMarkPDF.exe`.

            Keep `QuickMarkPDF.exe`, `pdfium.dll`, and `WebView2Loader.dll` together (the UI is bundled inside the exe, so no `index.html` or `vendor/` folder is needed).
            Windows 11 already includes WebView2 Runtime. On some Windows 10 / LTSC / Server PCs, install Microsoft Edge WebView2 Runtime (Evergreen).
