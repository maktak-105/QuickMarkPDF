name: Build and upload distribution asset

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install MinGW and Python
        shell: pwsh
        run: choco install mingw python --yes --no-progress
      - name: Fetch native dependencies
        shell: pwsh
        run: |
          ./scripts/fetch_webview2_sdk.ps1
          ./scripts/fetch_pdfium.ps1
      - name: Build and test
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python scripts/build.py all
          if ($LASTEXITCODE -ne 0) { throw 'Build or native tests failed' }
      - name: Package distribution files
        shell: pwsh
        run: |
          $files = @(
            'dist/QuickMarkPDF.exe', 'dist/QuickMarkPDF_cli.exe',
            'dist/pdfium.dll', 'dist/WebView2Loader.dll',
            'docs/distribution/readme.txt', 'docs/distribution/readme_jp.txt',
            'docs/distribution/history.txt', 'docs/distribution/history_jp.txt',
            'docs/distribution/LICENSE.txt', 'docs/distribution/LICENSE_jp.txt'
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
          }
          $staging = Join-Path $env:RUNNER_TEMP 'QuickMarkPDF-package'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          foreach ($file in $files) { Copy-Item -LiteralPath $file -Destination $staging -Force }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'QuickMarkPDF-binary.zip') -Force
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $paths = @('QuickMarkPDF-binary.zip', 'dist/QuickMarkPDF.exe', 'dist/QuickMarkPDF_cli.exe', 'dist/pdfium.dll', 'dist/WebView2Loader.dll')
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToUpperInvariant()
            "$hash  $(Split-Path -Leaf $path)"
          }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            QuickMarkPDF-binary.zip
            SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
          body: |
            QuickMarkPDF ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Download `QuickMarkPDF-binary.zip`, extract every file into the same folder, and run `QuickMarkPDF.exe`.
            Keep `QuickMarkPDF.exe`, `pdfium.dll`, and `WebView2Loader.dll` together. The UI is embedded in the executable.
