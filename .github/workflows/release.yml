name: Build and upload distribution asset

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to update, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python -m PyInstaller quickmarkpdf.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }

      - name: Package distribution files
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'QuickMarkPDF-package'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path 'dist/QuickMarkPDF/*' -Destination $staging -Recurse -Force
          $docs = @(
            'dist/documents/readme.txt',
            'dist/documents/readme_jp.txt',
            'dist/documents/history.txt',
            'dist/documents/history_jp.txt',
            'dist/documents/LICENSE.txt',
            'dist/documents/LICENSE_jp.txt'
          )
          foreach ($file in $docs) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
            Copy-Item -LiteralPath $file -Destination $staging -Force
          }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'QuickMarkPDF-binary.zip') -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: QuickMarkPDF-binary.zip
          overwrite_files: true
          generate_release_notes: true
