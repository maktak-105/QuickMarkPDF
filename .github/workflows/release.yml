name: Build and upload distribution asset

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write       # upload the release assets
      id-token: write       # sign the build provenance attestation
      attestations: write   # store the build provenance attestation
    steps:
      # Actions are pinned to full commit SHAs (the tag is kept in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install MinGW and Python
        shell: pwsh
        # Versions are those the last green run used (mingw 16.1.0, python 3.15.2). --version applies to every
        # package on the command line, so each package gets its own command.
        run: |
          choco install mingw --version=16.1.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install mingw failed' }
          choco install python --version=3.15.2 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install python failed' }
      - name: Fetch native dependencies
        shell: pwsh
        run: |
          ./scripts/fetch_webview2_sdk.ps1
          ./scripts/fetch_pdfium.ps1
      - name: Build and test
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          node tests/markdown_render_test.js
          if ($LASTEXITCODE -ne 0) { throw 'Markdown renderer tests failed' }
          python scripts/build.py all
          if ($LASTEXITCODE -ne 0) { throw 'Build or native tests failed' }
      - name: Package distribution files
        shell: pwsh
        run: |
          $files = @(
            'dist/QuickMarkPDF.exe', 'dist/QuickMarkPDF_cli.exe',
            'dist/pdfium.dll', 'dist/WebView2Loader.dll',
            'docs/distribution/readme.txt', 'docs/distribution/readme_jp.txt',
            'docs/distribution/history.txt', 'docs/distribution/history_jp.txt',
            'docs/distribution/LICENSE.txt', 'docs/distribution/LICENSE_jp.txt'
          )
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing distribution file: $file" }
          }
          $staging = Join-Path $env:RUNNER_TEMP 'QuickMarkPDF-package'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          foreach ($file in $files) { Copy-Item -LiteralPath $file -Destination $staging -Force }
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'QuickMarkPDF-binary.zip') -Force
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $paths = @('QuickMarkPDF-binary.zip', 'dist/QuickMarkPDF.exe', 'dist/QuickMarkPDF_cli.exe', 'dist/pdfium.dll', 'dist/WebView2Loader.dll')
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToUpperInvariant()
            "$hash  $(Split-Path -Leaf $path)"
          }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
      # SHA256SUMS.txt travels with the release, so it only detects a damaged download. The attestation is
      # signed by GitHub and ties these files to this workflow run and commit; check one with:
      #   gh attestation verify QuickMarkPDF-binary.zip --repo maktak-105/QuickMarkPDF
      # Only files built here are attested -- pdfium.dll and WebView2Loader.dll are third-party binaries.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            QuickMarkPDF-binary.zip
            dist/QuickMarkPDF.exe
            dist/QuickMarkPDF_cli.exe
      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            QuickMarkPDF-binary.zip
            SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
          body: |
            QuickMarkPDF ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

            Download `QuickMarkPDF-binary.zip`, extract every file into the same folder, and run `QuickMarkPDF.exe`.
            Keep `QuickMarkPDF.exe`, `pdfium.dll`, and `WebView2Loader.dll` together. The UI is embedded in the executable.

            Provenance: `gh attestation verify QuickMarkPDF-binary.zip --repo maktak-105/QuickMarkPDF`
