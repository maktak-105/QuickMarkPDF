name: "CodeQL"

on:
  push:
    branches: [main, agent/cpp-core-bootstrap]
  pull_request:
    branches: [main, agent/cpp-core-bootstrap]
  schedule:
    - cron: '24 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: cpp
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # python/ (PySide6) is the spec of record; core/native/ (C++/WebView2)
      # is the current build target. Both are scanned. See document/environment.md.

      - name: Install MinGW and Python
        if: matrix.language == 'cpp'
        shell: pwsh
        run: choco install mingw python --yes --no-progress

      - name: Fetch WebView2 SDK and PDFium
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          powershell -File scripts\fetch_webview2_sdk.ps1
          powershell -File scripts\fetch_pdfium.ps1

      - name: Build C++/WebView2 application
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python build_native.py --skip-tests
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
