name: "CodeQL"

on:
  push:
    branches: [main, agent/cpp-core-bootstrap]
  pull_request:
    branches: [main, agent/cpp-core-bootstrap]
  schedule:
    - cron: '24 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: cpp
            build-mode: manual
          # src/ui/js (the Markdown converter and the page logic) is where the
          # XSS findings of the 2026-11-23 audit lived, so it is analyzed too.
          - language: javascript-typescript
            build-mode: none

    steps:
      # Actions are pinned to full commit SHAs (the tag is kept in the comment).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # proto/ contains the PySide6 prototype; src/ is the native build target.
      # See docs/environment.md.

      - name: Install MinGW and Python
        if: matrix.language == 'cpp'
        shell: pwsh
        # Same versions as ci.yml. --version applies to every package on the
        # command line, so each package gets its own command.
        run: |
          choco install mingw --version=16.1.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install mingw failed' }
          choco install python --version=3.15.2 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'choco install python failed' }

      - name: Fetch WebView2 SDK and PDFium
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          powershell -File scripts\fetch_webview2_sdk.ps1
          powershell -File scripts\fetch_pdfium.ps1

      - name: Build C++/WebView2 application
        if: matrix.language == 'cpp'
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = 'utf-8'
          python scripts/build.py build
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          category: "/language:${{ matrix.language }}"
