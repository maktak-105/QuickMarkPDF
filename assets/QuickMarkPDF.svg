<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#151b26"/>
      <stop offset="1" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="pageShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- page -->
  <g filter="url(#pageShadow)">
    <path d="M74 52 H150 L182 84 V204 A8 8 0 0 1 174 212 H74 A8 8 0 0 1 66 204 V60 A8 8 0 0 1 74 52 Z" fill="#f5f7fa"/>
    <path d="M150 52 L182 84 H158 A8 8 0 0 1 150 76 Z" fill="#c9d3e0"/>
  </g>

  <!-- accent title bar -->
  <rect x="84" y="104" width="76" height="16" rx="8" fill="url(#bar)" filter="url(#glow)"/>

  <!-- text lines -->
  <rect x="84" y="134" width="82" height="7" rx="3.5" fill="#aeb8c6"/>
  <rect x="84" y="150" width="82" height="7" rx="3.5" fill="#aeb8c6"/>
  <rect x="84" y="166" width="52" height="7" rx="3.5" fill="#aeb8c6"/>

  <!-- split accent mark -->
  <path d="M182 150 l14 14 -14 14" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
