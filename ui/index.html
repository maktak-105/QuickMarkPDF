<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickMarkPDF</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">QuickMarkPDF</div>
    <button id="open-button">PDFを開く</button>
    <button id="save-button" disabled>保存</button>
    <span id="status">WebView2 UI 起動済み</span>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <h2>ページ</h2>
      <div id="page-list" class="empty">PDFを開くとページ一覧を表示します。</div>
    </aside>
    <section class="preview" id="preview">
      <div class="welcome">
        <h1>QuickMarkPDF</h1>
        <p>C++バックエンドとWebView2で動作するPDF編集画面です。</p>
        <p class="muted">PDFエンジン接続を次の実装段階で追加します。</p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
